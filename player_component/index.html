<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
  body {
    background: #050914; color: #f8fafc;
    font-family: Inter, "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }
  #app { height: 100vh; min-height: 560px; display: flex; flex-direction: column; }
  #stage {
    position: relative; flex: 1; min-height: 360px;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 30%, #17243b, #050914 72%);
    overflow: hidden;
  }
  #slide-image {
    max-width: 100%; max-height: 100%; width: 100%; height: 100%;
    object-fit: contain; display: none;
  }
  #empty { color: #94a3b8; padding: 24px; text-align: center; }
  #ai-slide {
    display: none; width: min(100%, 1100px); height: 100%;
    padding: clamp(24px, 6vw, 72px);
    overflow-y: auto; background: linear-gradient(135deg, #111c32, #0b1220);
  }
  #ai-slide h1 { color: #67d7ff; font-size: clamp(28px, 4vw, 48px); margin: 0 0 28px; }
  #ai-slide ul { padding-left: 1.2em; font-size: clamp(18px, 2vw, 27px); line-height: 1.55; }
  #ai-slide li { margin: 0 0 16px; }
  #answer-slide {
    display: none; position: absolute; left: 4%; right: 4%; bottom: 18px;
    max-height: 38%; overflow: auto; white-space: pre-wrap;
    background: rgba(9, 18, 34, .96); border: 1px solid #38bdf8;
    border-radius: 12px; padding: 16px 20px; line-height: 1.5;
    box-shadow: 0 12px 40px rgba(0,0,0,.4);
  }
  #toolbar {
    display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
    padding: 12px; background: #111a2b; border-top: 1px solid #26364f;
  }
  button {
    border: 1px solid #40516d; color: #f8fafc; background: #1d2a40;
    border-radius: 8px; padding: 9px 13px; font-size: 14px;
    cursor: pointer;
  }
  button:hover { border-color: #38bdf8; background: #263953; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #counter { color: #b7c6dc; font-size: 13px; min-width: 82px; text-align: center; }
  #prompt {
    flex: 1; min-width: 170px; color: white; background: #08111f;
    border: 1px solid #40516d; border-radius: 8px; padding: 11px 12px;
    font-size: 14px; outline: none;
  }
  #prompt:focus { border-color: #38bdf8; }
  #status { width: 100%; color: #67d7ff; font-size: 12px; min-height: 16px; }
  .listening { background: #166534; border-color: #22c55e; }
  @media (max-width: 650px) {
    #toolbar { gap: 7px; }
    #prompt { order: 5; flex-basis: 100%; }
  }
</style>
</head>
<body>
<div id="app">
  <main id="stage">
    <img id="slide-image" alt="Presentation slide">
    <section id="ai-slide">
      <h1 id="ai-title"></h1>
      <ul id="ai-bullets"></ul>
    </section>
    <div id="empty">Loading presentation…</div>
    <div id="answer-slide"></div>
  </main>
  <footer id="toolbar">
    <button id="prev" type="button">◀ Prev</button>
    <span id="counter">Slide 0 / 0</span>
    <button id="next" type="button">Next ▶</button>
    <input id="prompt" type="text" placeholder="Ask about this slide or request a new slide…">
    <button id="send" type="button">Ask AI</button>
    <button id="mic" type="button" title="Voice input">🎤</button>
    <button id="stop-voice" type="button" title="Stop spoken response">■</button>
    <div id="status" role="status" aria-live="polite"></div>
  </footer>
</div>

<script>
(() => {
  const imageEl = document.getElementById("slide-image");
  const emptyEl = document.getElementById("empty");
  const aiSlideEl = document.getElementById("ai-slide");
  const answerEl = document.getElementById("answer-slide");
  const promptEl = document.getElementById("prompt");
  const statusEl = document.getElementById("status");
  const counterEl = document.getElementById("counter");
  const micBtn = document.getElementById("mic");

  let slides = [];
  let currentSlide = 0;
  let responseId = -1;
  let recognition = null;
  let listening = false;
  let extraSlides = [];

  function sendToStreamlit(type, payload = {}) {
    window.parent.postMessage({
      isStreamlitMessage: true,
      type,
      ...payload
    }, "*");
  }

  function setHeight() {
    sendToStreamlit("streamlit:setFrameHeight", { height: 680 });
  }

  function renderSlide() {
    const total = slides.length + extraSlides.length;
    currentSlide = Math.max(0, Math.min(currentSlide, Math.max(0, total - 1)));

    imageEl.style.display = "none";
    aiSlideEl.style.display = "none";
    answerEl.style.display = "none";
    emptyEl.style.display = total ? "none" : "block";

    if (currentSlide < slides.length) {
      imageEl.src = slides[currentSlide].src;
      imageEl.style.display = "block";
    } else if (extraSlides.length) {
      const item = extraSlides[currentSlide - slides.length];
      document.getElementById("ai-title").textContent = item.title;
      const list = document.getElementById("ai-bullets");
      list.replaceChildren();
      item.bullets.forEach(text => {
        const li = document.createElement("li");
        li.textContent = text;
        list.appendChild(li);
      });
      aiSlideEl.style.display = "block";
    }

    counterEl.textContent = `Slide ${total ? currentSlide + 1 : 0} / ${total}`;
    document.getElementById("prev").disabled = currentSlide <= 0;
    document.getElementById("next").disabled = currentSlide >= total - 1;
  }

  function nextSlide() {
    if (currentSlide < slides.length + extraSlides.length - 1) {
      currentSlide++;
      renderSlide();
    }
  }

  function prevSlide() {
    if (currentSlide > 0) {
      currentSlide--;
      renderSlide();
    }
  }

  function speakText(text) {
    if (!("speechSynthesis" in window) || !text) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 1;
    utterance.pitch = 1;
    window.speechSynthesis.speak(utterance);
  }

  function submitPrompt() {
    const prompt = promptEl.value.trim();
    if (!prompt) return;

    const requestId = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
    statusEl.textContent = "Sending to AI…";
    document.getElementById("send").disabled = true;

    sendToStreamlit("streamlit:setComponentValue", {
      value: {
        request_id: requestId,
        prompt,
        slide_index: currentSlide
      }
    });
  }

  function toggleMic() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      statusEl.textContent = "Voice input is not supported here. Try Chrome.";
      return;
    }

    if (listening && recognition) {
      recognition.stop();
      return;
    }

    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.lang = navigator.language || "en-US";

    recognition.onstart = () => {
      listening = true;
      micBtn.classList.add("listening");
      statusEl.textContent = "Listening…";
    };

    recognition.onresult = (event) => {
      let transcript = "";
      for (let i = event.resultIndex; i < event.results.length; i++) {
        transcript += event.results[i][0].transcript;
      }
      promptEl.value = transcript;
    };

    recognition.onerror = (event) => {
      statusEl.textContent = `Microphone error: ${event.error}`;
    };

    recognition.onend = () => {
      listening = false;
      micBtn.classList.remove("listening");
      if (promptEl.value.trim()) submitPrompt();
      else statusEl.textContent = "";
    };

    try {
      recognition.start();
    } catch (error) {
      statusEl.textContent = "Could not start microphone. Please try again.";
    }
  }

  function handleAIResponse(response, newResponseId) {
    if (!response || newResponseId === responseId) return;
    responseId = newResponseId;

    document.getElementById("send").disabled = false;
    promptEl.value = "";

    if (response.type === "slide") {
      extraSlides.push({
        title: String(response.title || "AI-generated slide"),
        bullets: Array.isArray(response.bullets) ? response.bullets.map(String) : []
      });
      currentSlide = slides.length + extraSlides.length - 1;
      answerEl.style.display = "none";
      renderSlide();
      speakText(
        extraSlides[extraSlides.length - 1].title + ". " +
        extraSlides[extraSlides.length - 1].bullets.join(". ")
      );
    } else if (response.type === "answer") {
      answerEl.textContent = String(response.display_text || "");
      answerEl.style.display = "block";
      speakText(String(response.spoken_text || response.display_text || ""));
    }

    statusEl.textContent = "AI response received.";
  }

  document.getElementById("prev").addEventListener("click", prevSlide);
  document.getElementById("next").addEventListener("click", nextSlide);
  document.getElementById("send").addEventListener("click", submitPrompt);
  document.getElementById("mic").addEventListener("click", toggleMic);
  document.getElementById("stop-voice").addEventListener("click", () => {
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
  });

  promptEl.addEventListener("keydown", event => {
    if (event.key === "Enter") submitPrompt();
  });

  window.addEventListener("keydown", event => {
    if (document.activeElement === promptEl) {
      if (event.key === "Escape") promptEl.blur();
      return;
    }
    if (event.key === "/" ) {
      event.preventDefault();
      promptEl.focus();
    } else if (event.key === "ArrowRight" || event.key === "PageDown") {
      nextSlide();
    } else if (event.key === "ArrowLeft" || event.key === "PageUp") {
      prevSlide();
    }
  });

  window.addEventListener("message", event => {
    const message = event.data;
    if (!message || message.type !== "streamlit:render") return;

    const args = message.args || {};
    if (Array.isArray(args.slides)) {
      slides = args.slides;
      renderSlide();
    }

    handleAIResponse(args.response, args.response_id);
    setHeight();
  });

  sendToStreamlit("streamlit:componentReady", { apiVersion: 1 });
  setHeight();
})();
</script>
</body>
</html>
